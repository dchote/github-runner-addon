# https://developers.home-assistant.io/docs/apps/configuration
name: GitHub Runner Manager
version: "0.5.3"
slug: github_runner
description: Control plane for multiple GitHub Actions self-hosted runners (Docker; default image myoung34/github-runner)
url: "https://github.com/dchote/github-runner-addon/tree/main/github_runner"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:github
docker_api: true
# Persist runners.json under the standard HA app data directory (/data).
# No extra map entries required — /data is always provided and included in backups.
options:
  log_level: info
  mount_docker_sock: true
  runner_image: myoung34/github-runner:latest
  github_pat: ""
schema:
  log_level: list(debug|info|warn|error)
  mount_docker_sock: bool
  runner_image: str
  github_pat: password

# Pre-built multi-arch image on GHCR (preferred for end users).
# To build from source on the Home Assistant host instead, comment out this
# line, then install/rebuild the app so Supervisor compiles the Dockerfile.
image: ghcr.io/dchote/github-runner-addon
